<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LaMini-T5-61M</title>
  <link rel="stylesheet" href="style.css"></link>
</head>

<body>
  <div id="app">
    <header>
      <div class="model-dot" id="dot"></div>
      <span class="model-name">LaMini-T5-61M</span>
      <span class="status-text" id="status">loading model…</span>
    </header>

    <div id="progress-bar">
      <div id="progress-fill"></div>
    </div>

    <div id="messages">
      <div id="empty">
        <span class="e-title">61M params · in-browser</span>
        <span class="e-sub">ask it anything</span>
      </div>
    </div>

    <div id="input-area">
      <div id="form">
        <textarea id="input" rows="1" placeholder="Ask something…" disabled></textarea>
        <button id="send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script>
    (()=>{
      const routes = {
        'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.0/dist/ort-wasm-simd-threaded.jsep.wasm':{
          url: './ort-wasm-simd-threaded.jsep.gz',
          headers : {
            'content-type':'application/wasm'
          }
        },
        'https://huggingface.co/Xenova/LaMini-T5-61M/resolve/main/config.json':{
          url:'./llamini-config.json',
        }
      };
      const _fetch = globalThis.fetch;
      globalThis.fetch = Object.setPrototypeOf(async function fetch(...args){
        try{
          const url = String(args[0].url ?? args[0]);
          if(routes[url]){
            const res = await _fetch(routes[url].url);
            if(routes[url].headers){
              const value = new Headers(res.headers.entries());
              for(header in routes[url].headers){
                value.set(key,routes[url].headers[key]);
              }
              Object.defineProptery(res,'headers',{value});
            }
            const ds = new DecompressionStream("gzip");
            return new Response(res.body.pipeThrough(new DecompressionStream("gzip")),res);
          }
          return await _fetch.apply(this,args);
        }catch(e){
          const statusText = String(e);
          return new Response(statusText,{staus:500,statusText});
        }
      },_fetch);
    })();
  </script>
  <script type="module">
    import {
      pipeline,
      env
    } from './transformers@3.5.0.js';

    const MODEL = 'Xenova/LaMini-T5-61M';

    const dot = document.getElementById('dot');
    const status = document.getElementById('status');
    const messages = document.getElementById('messages');
    const empty = document.getElementById('empty');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const progBar = document.getElementById('progress-bar');
    const progFill = document.getElementById('progress-fill');

    // auto-grow textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    let generator = null;
    let busy = false;

    function setStatus(text) {
      status.textContent = text;
    }

    function addMessage(role, text, extra = '') {
      empty.classList.add('hidden');
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;
      const label = document.createElement('div');
      label.className = 'msg-label';
      label.textContent = role === 'user' ? 'you' : 'lamini';
      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (extra ? ' ' + extra : '');
      bubble.textContent = text;
      wrap.appendChild(label);
      wrap.appendChild(bubble);
      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    function showDiag(err) {
      empty.classList.add('hidden');
      const ua = navigator.userAgent;
      const wasm = typeof WebAssembly !== 'undefined';
      const sab = typeof SharedArrayBuffer !== 'undefined';
      const mem = navigator.deviceMemory ?? 'unknown';
      const lines = [
        '── LOAD FAILED ──',
        '',
        `error: ${err?.message ?? String(err)}`,
        '',
        ...(err?.stack ? [`stack:\n${err.stack}`, ''] : []),
        '── diagnostics ──',
        `wasm:   ${wasm}`,
        `sab:    ${sab}`,
        `coi:    ${crossOriginIsolated}`,
        `ram:    ${mem} GB (hint)`,
        `ua:     ${ua}`,
      ];

      const wrap = document.createElement('div');
      wrap.className = 'msg bot';
      const label = document.createElement('div');
      label.className = 'msg-label';
      label.textContent = 'error';
      const bubble = document.createElement('pre');
      bubble.className = 'bubble';
      bubble.style.cssText = 'white-space:pre-wrap;word-break:break-all;font-size:11px;color:#ff7eb3;';
      bubble.textContent = lines.join('\n');
      wrap.appendChild(label);
      wrap.appendChild(bubble);
      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;
    }

    // Load model
    dot.className = 'model-dot loading';
    progBar.classList.add('active');

    try {
      generator = await pipeline('text2text-generation', MODEL, {
        dtype: 'q8',
        progress_callback: (p) => {
          if (p.status === 'downloading' && p.total) {
            const pct = Math.round((p.loaded / p.total) * 100);
            progFill.style.width = pct + '%';
            setStatus(`downloading… ${pct}%`);
          } else if (p.status === 'initiate') {
            setStatus('loading weights…');
          } else if (p.status === 'loading') {
            setStatus('compiling wasm…');
          }
        }
      });

      dot.className = 'model-dot ready';
      setStatus('ready');
      progBar.classList.remove('active');
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    } catch (err) {
      dot.className = 'model-dot';
      setStatus('failed to load');
      progBar.classList.remove('active');
      console.error(err);
      showDiag(err);
    }

    async function send() {
      if (busy || !generator) return;
      const text = input.value.trim();
      if (!text) return;

      busy = true;
      sendBtn.disabled = true;
      input.value = '';
      input.style.height = 'auto';

      addMessage('user', text);
      const thinkBubble = addMessage('bot', '…', 'thinking');

      try {
        const result = await generator(text, {
          max_new_tokens: 128,
          // T5 doesn't need much more — it's a text2text model
        });
        const out = result[0]?.generated_text ?? '(no output)';
        thinkBubble.textContent = out;
        thinkBubble.classList.remove('thinking');
      } catch (err) {
        thinkBubble.textContent = 'error: ' + err.message;
        thinkBubble.classList.remove('thinking');
        console.error(err);
      }

      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

  </script>
</body>

</html>
