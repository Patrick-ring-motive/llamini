<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LaMini-T5-61M</title>
  <link rel="stylesheet" href="style.css"></link>
</head>

<body>
  <div id="app">
    <header>
      <div class="model-dot" id="dot"></div>
      <span class="model-name">LaMini-T5-61M</span>
      <span class="status-text" id="status">loading model…</span>
    </header>

    <div id="progress-bar">
      <div id="progress-fill"></div>
    </div>

    <div id="messages">
      <div id="empty">
        <span class="e-title">61M params · in-browser</span>
        <span class="e-sub">ask it anything</span>
      </div>
    </div>

    <div id="input-area">
      <div id="form">
        <textarea id="input" rows="1" placeholder="Ask something…" disabled></textarea>
        <button id="send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script src="./script.js"></script>
  <script src="./test.js" type="module"></script>
</body>

</html>
